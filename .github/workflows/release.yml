name: Axiomify Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Lock the default GITHUB_TOKEN to read-only at the top level.
# The release job explicitly requests the two write permissions it needs:
#   contents: write       — to create GitHub Releases and push version tags
#   pull-requests: write  — to open and update the "Version Packages" PR
# No other job in this workflow needs write access.
permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Releases, push version bump commits
      pull-requests: write  # open/update the changesets "Version Packages" PR
    steps:
      - name: Checkout Repo
        # Pin to SHA — equivalent to actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # Pin to SHA — equivalent to actions/setup-node@v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        # Uses the floating v1 tag — Dependabot will open a PR to pin this
        # to a verified SHA once it runs. See .github/dependabot.yml.
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npx changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
