name: Axiomify Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Lock the default GITHUB_TOKEN to read-only at the top level.
# The release job explicitly requests the two write permissions it needs:
#   contents: write       — to create GitHub Releases and push version tags
#   pull-requests: write  — to open and update the "Version Packages" PR
# No other job in this workflow needs write access.
permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Releases, push version bump commits
      pull-requests: write # open/update the changesets "Version Packages" PR
      id-token: write # required for npm package provenance / signing
    steps:
      - name: Checkout Repo
        # Pin to SHA — equivalent to actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # Pin to SHA — equivalent to actions/setup-node@v4.1.0
        # Publish on the oldest native runtime supported by this release line.
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'
          # registry-url writes an .npmrc that authenticates npm publish via
          # NODE_AUTH_TOKEN. Without this, npm publish is unauthenticated.
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm ci

      - name: Verify release candidate
        run: |
          npm audit --audit-level=high
          npm run check
          npm run coverage

      - name: Build Packages
        run: npm run build

      - name: Validate published package size
        run: npm run check:package-size

      - name: Create Release PR or Publish
        id: changesets
        # Pin to SHA — equivalent to changesets/action@v1.4.9
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6789308
        with:
          # Override the default `npx changeset publish` so we get ONE git
          # tag per release instead of 16 (one per @axiomify/* package).
          # The custom script publishes every workspace via
          # `npm publish --workspaces` and then creates a single `v<ver>`
          # tag from the root package.json version. See
          # scripts/publish-workspace.mjs for the full rationale.
          publish: node scripts/publish-workspace.mjs
          version: npx changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: used by changesets/action for its own registry checks.
          # NODE_AUTH_TOKEN: used by npm publish via the .npmrc written by
          # actions/setup-node above. Both must be set or publish will fail
          # with a 401/404 authentication error.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
