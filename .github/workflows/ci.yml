name: Axiomify CI

on: [push, pull_request]

# Lock the default GITHUB_TOKEN to read-only at the top level.
# Any job that needs write access must declare it explicitly at the job level.
# This prevents a compromised action from using the token to push code,
# create releases, or modify repository settings.
permissions: read-all

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This job only reads source and uploads coverage — no write permissions needed.
    permissions:
      contents: read   # checkout
    strategy:
      matrix:
        node-version: [22, 23, 24]
    steps:
      - name: Checkout Code
        # Pin to SHA instead of floating tag to prevent supply-chain attacks.
        # Equivalent to actions/checkout@v4 at time of writing — verify and
        # update this SHA when you intentionally upgrade the action.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        # `npm ci` is deterministic — it installs exactly what is in
        # package-lock.json and fails if the lock file is out of sync.
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Typecheck & Build
        run: npm run build

      - name: Run Tests & Coverage
        run: npm run coverage

      - name: Upload Coverage to Codecov
        # Pin to SHA for supply-chain safety.
        # SHA corresponds to codecov/codecov-action@v4.5.0 — verify and update
        # when intentionally upgrading.
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Native adapter integration job — runs the REAL uWS-backed tests on the
  # most common production target (Linux + Node 22 LTS). Without this, every
  # `describe.skipIf(!uwsSupported)` block could silently skip across the
  # entire CI matrix and we'd ship regressions in the HTTP layer with green
  # checkmarks. The job fails if the native suite reports zero passing tests
  # — i.e. if the uWS binary stopped loading or the suite was renamed.
  # ---------------------------------------------------------------------------
  native-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run @axiomify/native test suite
        run: npx vitest run packages/native --reporter=json --outputFile=native-results.json
        # vitest exits non-zero on any test failure; --reporter=json gives us
        # the structured output to verify execution happened.

      - name: Assert native tests actually executed (not all skipped)
        run: |
          PASSED=$(node -e "console.log(require('./native-results.json').numPassedTests)")
          SKIPPED=$(node -e "console.log(require('./native-results.json').numPendingTests || 0)")
          echo "Native tests — passed: $PASSED, skipped: $SKIPPED"
          if [ "$PASSED" -lt 10 ]; then
            echo "::error::Native test suite passed only $PASSED tests. The uWS-backed integration tests are not running on Node 22 / Linux. This is the production target — the suite cannot silently skip here."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Example app smoke test — fails CI if examples/my-app cannot install or
  # typecheck. This is the first thing a new user runs (`npx axiomify init`
  # generates a similar shape), so a broken example is a release blocker.
  # ---------------------------------------------------------------------------
  example-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'

      - name: Install workspace (so example can resolve workspace:* deps)
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Typecheck example app
        working-directory: examples/my-app
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Smoke benchmark — proves the benchmark harness still works and uploads
  # the raw autocannon result as a CI artifact. Does NOT gate on absolute
  # req/s numbers (cloud CI runners vary too much to make that meaningful)
  # — but DOES fail on broken servers, non-2xx responses, and catastrophic
  # regressions (< 1000 req/s on /ping is "something is on fire").
  #
  # See `benchmarks/smoke.mjs` for the implementation and `benchmarks/README.md`
  # for the methodology of the full suite.
  # ---------------------------------------------------------------------------
  bench-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Run smoke benchmark
        run: node benchmarks/smoke.mjs

      - name: Upload smoke-result.json
        if: always()
        # SHA pin: actions/upload-artifact@v4.4.0
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: bench-smoke-result-${{ github.sha }}
          path: benchmarks/smoke-result.json
          if-no-files-found: warn
          retention-days: 30
