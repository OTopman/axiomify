name: CodeQL

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: '0 6 * * 1'

# Lock the default GITHUB_TOKEN to read-only at the top level.
permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # security-events: write is the minimum required to upload SARIF results
    # to GitHub Advanced Security. contents: read is required for checkout.
    # All other permissions remain at the read-all default.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        # Pin to SHA — equivalent to actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        # Pin to SHA — equivalent to github/codeql-action/init@v3.27.0
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0c2672964e6ee37
        with:
          languages: javascript-typescript

      - name: Autobuild
        # Pin to SHA — equivalent to github/codeql-action/autobuild@v3.27.0
        uses: github/codeql-action/autobuild@b56ba49b26e50535fa1e7f7db0c2672964e6ee37

      - name: Perform CodeQL Analysis
        # Pin to SHA — equivalent to github/codeql-action/analyze@v3.27.0
        # security-events: write declared above allows this step to upload
        # SARIF results to GitHub Advanced Security (not a write to the repo).
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0c2672964e6ee37
